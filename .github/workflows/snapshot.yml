# Daily option-chain snapshot.
#
# GitHub cron can run hours late (first day: scheduled 19:30 UTC, ran 22:36), so
# this fires every 30 min through the last two hours of the US session, on odd
# minutes (GitHub advises avoiding :00/:30). app/pipeline.py makes extra runs
# harmless: it stores at most one chain per ticker per day, only during regular
# hours, and only from 14:00 ET on. Hours 18-20 UTC cover 14:00-16:00 ET in both
# EDT and EST.
#
# Only data/chains/ is committed. Metrics are a local cache rebuilt from chains.

name: snapshot

on:
  schedule:
    - cron: "17,47 18-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            app
            ivlib
            data
            pyproject.toml
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -e ".[app]"

      - name: snapshot watchlist
        run: python -m app.pipeline snapshot

      - name: commit new chains
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          mkdir -p data/chains
          git add -A data/chains
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "snapshot $(date -u +%F)"
            git push
          fi
