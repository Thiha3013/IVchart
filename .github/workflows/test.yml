# Tests on the pinned stack Render installs (app/constraints.txt). Skips the
# API's own commits: snapshots and Track.
name: test
on:
  push: { branches: [main], paths-ignore: ["data/chains/**", "data/implied.parquet", "app/watchlist.txt", "web/**"] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -c app/constraints.txt -e ".[app,dev]"
      - run: python -m pytest -q
