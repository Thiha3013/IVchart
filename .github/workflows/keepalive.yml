# Keep the free Render instance awake. It sleeps after 15 min idle and takes
# ~15 s to wake; this pings every 14 min around the clock. Render free =
# 750 instance-hours/month; a 31-day month is 744, so one service fits.

name: keepalive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -m 90 -o /dev/null -w "%{http_code} %{time_total}s\n" https://ivchart-api.onrender.com/api/health
