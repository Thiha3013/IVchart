# Backup pinger. cron-job.org (every 5 min) keeps Render awake; GitHub runs this
# schedule every few hours at best, but it re-wakes the API if that pinger dies.
# No --fail: an HTTP error here would only email a failed run.

name: keepalive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -m 90 -o /dev/null -w "%{http_code} %{time_total}s\n" https://ivchart-api.onrender.com/api/health
