[project]
name = "ivlib"
version = "0.1.0"
description = "Vectorized implied volatility engine for equity options"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
bench = ["matplotlib>=3.7", "pyarrow>=14.0", "numba>=0.59"]
app = ["yfinance>=1.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx", "pyarrow>=14.0", "numba>=0.59"]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["ivlib", "app", "app.sources"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
