# Render Blueprint for the API. Frontend goes to Vercel (see web/vercel.json).
#
# Free tier: 512 MB RAM, sleeps after 15 min idle, ~1 min cold start, 750 h/mo
# (one always-on service uses 744 in a 31-day month: keep it the only free
# service in this workspace). Peak RSS ~225 MB since the vendor series is precomputed.
#
# The API snapshots its own watchlist (14:00-16:00 ET) and commits the chains;
# the push redeploys, so the instance's disk always mirrors the repo.
# Installs are pinned to app/constraints.txt, the set CI tests.

services:
  - type: web
    name: ivchart-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -c app/constraints.txt -e ".[app]"
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT --limit-concurrency 16
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NUMBA_CACHE_DIR
        value: /tmp/numba-cache
      - key: NUMBA_NUM_THREADS       # the box is 0.1 CPU; numba would otherwise size its pool to the host's cores
        value: "2"
      - key: GITHUB_REPO
        value: Thiha3013/IVchart
      - key: GITHUB_TOKEN
        sync: false          # set in the Render dashboard; never in the repo
      - key: WATCHLIST_MAX
        value: "40"
